version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: football_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-football_db}
      POSTGRES_USER: ${DB_USER:-football_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-football_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-football_user} -d ${DB_NAME:-football_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: football_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "8089:80"
    depends_on:
      - db

  pipeline:
    build:
      context: ./pipeline
    container_name: football_pipeline
    environment:
      API_KEY: ${API_KEY}
      API_URL: ${API_URL:-https://v3.football.api-sports.io}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-football_db}
      DB_USER: ${DB_USER:-football_user}
      DB_PASSWORD: ${DB_PASSWORD:-football_pass}
    volumes:
      - ./data:/app/data
      - ./pipeline:/app
      - ./dbt_project:/app/dbt_project
      - ./ml_predictor:/app/ml_predictor
    command: tail -f /dev/null
    depends_on:
      db:
        condition: service_healthy

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.3
    container_name: football_dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-football_db}
      DB_USER: ${DB_USER:-football_user}
      DB_PASSWORD: ${DB_PASSWORD:-football_pass}
    volumes:
      - ./dbt_project:/usr/app/dbt
    working_dir: /usr/app/dbt
    profiles:
      - dbt-only
    depends_on:
      db:
        condition: service_healthy

  airflow:
    image: apache/airflow:2.7.3-python3.10
    container_name: football_airflow
    restart: always
    user: "50000:0"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/data/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__LOAD_DEFAULT_CONNECTIONS=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./airflow/data:/opt/airflow/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8085:8080"
    command: standalone
    depends_on:
      - pipeline

  dashboard:
    image: python:3.10-slim
    container_name: football_dashboard
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-football_db}
      DB_USER: ${DB_USER:-football_user}
      DB_PASSWORD: ${DB_PASSWORD:-football_pass}
    volumes:
      - ./dashboard:/app
      - ./ml_predictor:/app/ml_predictor
    working_dir: /app
    ports:
      - "8500:8500"
    command: bash -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8500 --reload"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
